<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- sidepad brand mark: parallel voices converging into one conversation -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6B6BE0"/>
      <stop offset="1" stop-color="#4343C0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <!-- back voices (parallel answers stacking up) -->
  <rect x="118" y="112" width="228" height="132" rx="40" fill="#FFFFFF" opacity="0.26"/>
  <rect x="176" y="168" width="228" height="132" rx="40" fill="#FFFFFF" opacity="0.48"/>
  <!-- front bubble: the conversation -->
  <path d="M150 268 C150 243 170 223 195 223 L317 223 C342 223 362 243 362 268 L362 340 C362 365 342 385 317 385 L232 385 L196 419 L196 385 L195 385 C170 385 150 365 150 340 Z" fill="#FFFFFF"/>
  <!-- three voices typing -->
  <circle cx="215" cy="304" r="16" fill="#5B5BD6"/>
  <circle cx="256" cy="304" r="16" fill="#5B5BD6"/>
  <circle cx="297" cy="304" r="16" fill="#5B5BD6"/>
</svg>
